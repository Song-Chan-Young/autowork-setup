<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 2026-11-06 16:20 송찬영 [AI] 폰 홈 화면용 고정 주소 앱 - 안에 PC 의 '폰으로 보기'(바뀌는 주소)를 띄우고, 아이폰 알림(Web Push)을 받음 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 업무자동화">
<meta name="theme-color" content="#f6f6f4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>내 업무자동화</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f6f4; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; color: #1f1f1f; }
  #bar { display: none; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: #e3edfd; color: #1d5bbf; font-size: 14.5px; line-height: 1.5; }
  #bar.show { display: block; }
  #bar button { margin-top: 8px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 18px; background: #2f7fe8; color: #fff; }
  #bar .x { float: right; background: none; color: #1d5bbf; padding: 0 4px; margin: 0; font-size: 18px; }
  iframe { display: block; width: 100%; border: 0; height: 100vh; height: 100dvh; }
  #bar.show + iframe { height: calc(100dvh - 120px); }
  .help { padding: calc(40px + env(safe-area-inset-top)) 24px; text-align: center; line-height: 1.7; }
  .help img { width: 72px; }
</style>
</head>
<body>
<div id="bar"></div>
<iframe id="f" title="내 업무자동화" hidden></iframe>
<div class="help" id="help" hidden>
  <img src="icon.png" alt=""><h2>내 업무자동화</h2>
  <p>PC 프로그램의 [⚙ 컴퓨터 환경설정] &gt; [폰으로 보기]를 켜고<br>나온 QR 을 아이폰 카메라로 찍어 열어 주세요.</p>
</div>
<script>
const KEY = "aw_phone_url";
const $ = (id) => document.getElementById(id);
const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

async function urlFromCache() {   // 알림으로 온 새 주소(서비스 워커가 넣어 둠)
  try { const c = await caches.open("aw"); const r = await c.match("aw-url"); return r ? JSON.parse(await r.text()) : null; } catch (e) { return null; }
}
async function saveUrl(u) {
  const v = { u: u, t: Date.now() };
  try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
  try { const c = await caches.open("aw"); await c.put("aw-url", new Response(JSON.stringify(v))); } catch (e) {}
}
function fromLocal() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
function bar(html) { $("bar").innerHTML = html; $("bar").classList.toggle("show", !!html); }
function b64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); s += "=".repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function pushReady(u) {
  const base = new URL(u), tok = base.searchParams.get("t");
  const k = await (await fetch(base.origin + "/api/push/key?t=" + encodeURIComponent(tok))).json();
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub && localStorage.getItem("aw_vapid") !== k.key) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(k.key) });
  localStorage.setItem("aw_vapid", k.key);
  await fetch(base.origin + "/api/push/sub?t=" + encodeURIComponent(tok), { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(sub) });
}
async function enablePush(u) {
  try {
    const p = await Notification.requestPermission();
    if (p !== "granted") { bar("알림이 꺼져 있어요. 아이폰 [설정] &gt; [알림] &gt; [내 업무자동화]에서 켜 주세요."); return; }
    await pushReady(u);
    bar("");
  } catch (e) { bar("알림 켜기가 안 됐어요. PC 프로그램이 켜져 있는지 보고 다시 눌러 주세요.<br><button onclick='enablePush(cur)'>다시 알림 켜기</button>"); }
}
let cur = "";
function load(u) { cur = u; $("help").hidden = true; $("f").hidden = false; if ($("f").src !== u) $("f").src = u; }

(async () => {
  const qs = new URLSearchParams(location.search);
  // (원본, 2026-11-09 송찬영 [AI]) if (qs.get("u")) { await saveUrl(qs.get("u")); history.replaceState(null, "", location.pathname); }
  // 2026-11-09 10:13 송찬영 [AI] 주소(?u=)를 지우지 않음 - 아이폰 홈 화면 앱은 사파리와 저장소가 따로라, 추가할 때의 주소로만 PC 주소를 받음
  if (qs.get("u")) await saveUrl(qs.get("u"));
  const a = fromLocal(), b = await urlFromCache();
  const best = [a, b].filter(Boolean).sort((x, y) => y.t - x.t)[0];
  if (!best) { $("help").hidden = false; return; }
  load(best.u);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
    navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.url) { saveUrl(e.data.url); load(e.data.url); } });
  }
  if (!standalone) { bar("<button class='x' onclick='bar(\"\")'>×</button>사파리 아래 [공유] &gt; <b>[홈 화면에 추가]</b> 하고 홈 화면 아이콘으로 열면 알림도 받아요."); return; }
  if (!("PushManager" in window)) { bar("<button class='x' onclick='bar(\"\")'>×</button>이 아이폰은 알림을 못 받아요(iOS 16.4 이상 필요)."); return; }
  if (Notification.permission === "granted") { pushReady(best.u).catch(() => {}); return; }   // 주소가 바뀌었을 수 있어 매번 다시 알려 줌
  bar("<button class='x' onclick='bar(\"\")'>×</button>부탁한 일이 끝났을 때 같은 알림을 받으려면 눌러 주세요.<br><button onclick='enablePush(cur)'>알림 켜기</button>");
})();
</script>
</body>
</html>
